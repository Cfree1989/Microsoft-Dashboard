Screens:
  scrHome:
    Properties:
      Fill: =varColorBg
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Concurrent(
            Refresh(PrintRequests),
            Refresh(LabStatus)
        );
        Set(varLabStatus, LookUp(LabStatus, Title = "Current"));
        If(
            !IsBlank(varLabStatus),
            Set(varLabHours, Coalesce(varLabStatus.LabHours, varLabHours));
            Set(varPickupLocation, Coalesce(varLabStatus.PickupLocation, varPickupLocation))
        );
        // Skip if identity is not ready yet (StartScreen OnVisible can race OnStart).
        If(
            !IsBlank(varMeEmail) || !IsBlank(varMeEntraId),
            With(
                {
                    wMine: If(
                        !IsBlank(varMeEntraId),
                        Filter(
                            PrintRequests,
                            StudentEntraId = Text(varMeEntraId) || StudentEmail = varMeEmail || StudentEmail = varMeUPN
                        ),
                        Filter(
                            PrintRequests,
                            StudentEmail = varMeEmail || StudentEmail = varMeUPN
                        )
                    )
                },
                Set(
                    varNeedsConfirmCount,
                    CountRows(
                        Filter(
                            wMine,
                            Status.Value = "Pending",
                            Not(StudentConfirmed)
                        )
                    )
                );
                Set(
                    varPickupReadyCount,
                    CountRows(
                        Filter(
                            wMine,
                            Status.Value = "Completed"
                        )
                    )
                )
            )
        )
    Children:
      - conHeaderHome:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =varHeaderHeight
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - recHeaderBgHome:
                Control: Rectangle
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =varColorHeader
                  Height: =Parent.Height
                  Width: =Parent.Width
            - lblHeaderTitleHome:
                Control: Label
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =Color.White
                  Font: =varAppFont
                  FontWeight: =FontWeight.Semibold
                  Height: =30
                  Size: =18
                  Text: ="Print Lab Student Portal"
                  Width: =400
                  X: =20
                  Y: =11
      - conWelcome:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =conLabToday.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =conRequestsCard.Width
            X: =conActionCards.X + conRequestsCard.X
            Y: =conLabToday.Y
          Children:
            - lblWelcome:
                Control: Label
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =varColorText
                  Fill: =Color.Transparent
                  Font: =varAppFont
                  FontWeight: =FontWeight.Semibold
                  Height: =57
                  Size: =30
                  Text: ="Welcome, " & First(Split(varMeName, " ")).Value & "!"
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =11
            - lblSubtitle:
                Control: Label
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =varColorTextMuted
                  Fill: =Color.Transparent
                  Font: =varAppFont
                  Height: =30
                  Size: =14
                  Text: ="What would you like to do today?"
                  Visible: =false
                  Width: =Parent.Width
                  Y: =lblWelcome.Y + lblWelcome.Height
            - btnNeedsYou:
                Control: Classic/Button
                Properties:
                  BorderColor: =Color.Transparent
                  BorderThickness: =0
                  Color: =If(varNeedsConfirmCount > 0, varColorWarning, varColorSuccess)
                  Fill: =Color.Transparent
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =61
                  HoverBorderColor: =Color.Transparent
                  HoverColor: =Self.Color
                  HoverFill: =ColorFade(Self.Color, 85%)
                  OnSelect: =Navigate(scrMyRequests, varScreenTransition)
                  PressedBorderColor: =Color.Transparent
                  PressedFill: =ColorFade(Self.Color, 75%)
                  RadiusBottomLeft: =varBtnBorderRadius
                  RadiusBottomRight: =varBtnBorderRadius
                  RadiusTopLeft: =varBtnBorderRadius
                  RadiusTopRight: =varBtnBorderRadius
                  Text: |-
                    =If(
                        varNeedsConfirmCount > 0,
                        If(
                            varNeedsConfirmCount = 1,
                            "You have a print waiting for your OK — tap to confirm",
                            "You have " & varNeedsConfirmCount & " prints waiting for your OK — tap to confirm"
                        ),
                        If(
                            varPickupReadyCount = 1,
                            "You have a print ready for pickup — tap to view",
                            "You have " & varPickupReadyCount & " prints ready for pickup — tap to view"
                        )
                    )
                  Visible: =varNeedsConfirmCount > 0 || varPickupReadyCount > 0
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =lblWelcome.Y + lblWelcome.Height + 4
      - conActionCards:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =lblHoursBanner.Y - Self.Y - 12
            Width: =Parent.Width - (varSpacingXL * 2)
            X: =varSpacingXL
            Y: =conLabToday.Y + conLabToday.Height + 12
          Children:
            - conSubmitCard:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  BorderColor: =varColorBorderLight
                  BorderThickness: =1
                  Fill: =varColorBgCard
                  Height: =Parent.Height - varSpacingMD * 2
                  Width: =(Parent.Width - varSpacingSM * 2 - varSpacingXL) / 2
                  X: =varSpacingSM
                  Y: =varSpacingMD
                Children:
                  - icnSubmit:
                      Control: Classic/Icon
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =varColorPrimary
                        Height: =80
                        Icon: =Icon.Add
                        Width: =80
                        X: =(Parent.Width - 80) / 2
                        Y: =40
                  - lblSubmitTitle:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =varColorText
                        Font: =varAppFont
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        Size: =16
                        Text: ="Submit New Request"
                        Width: =Parent.Width
                        Y: =icnSubmit.Y + icnSubmit.Height + 20
                  - lblSubmitDesc:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =varColorTextMuted
                        Font: =varAppFont
                        Height: =50
                        Size: =12
                        Text: ="Upload your 3D model file and submit a new print request"
                        Width: =Parent.Width - (varSpacingLG * 2)
                        X: =varSpacingLG
                        Y: =lblSubmitTitle.Y + lblSubmitTitle.Height + 8
                  - btnGetStarted:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        Color: =Color.White
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =varColorPrimary
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        FontWeight: =FontWeight.Bold
                        Height: =varBtnHeightLarge
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(varColorPrimary, -15%)
                        OnSelect: =Navigate(scrSubmit, ScreenTransition.Fade)
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =ColorFade(varColorPrimary, -25%)
                        RadiusBottomLeft: =varBtnBorderRadius
                        RadiusBottomRight: =varBtnBorderRadius
                        RadiusTopLeft: =varBtnBorderRadius
                        RadiusTopRight: =varBtnBorderRadius
                        Size: =14
                        Text: ="GET STARTED"
                        Width: =Parent.Width - (varSpacingLG * 2)
                        X: =varSpacingLG
                        Y: =Parent.Height - 70
            - conRequestsCard:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  BorderColor: =varColorBorderLight
                  BorderThickness: =1
                  Fill: =varColorBgCard
                  Height: =Parent.Height - varSpacingMD * 2
                  Width: =(Parent.Width - varSpacingSM * 2 - varSpacingXL) / 2
                  X: =conSubmitCard.X + conSubmitCard.Width + varSpacingXL
                  Y: =varSpacingMD
                Children:
                  - icnRequests:
                      Control: Classic/Icon
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =varColorSuccess
                        Height: =80
                        Icon: =Icon.DetailList
                        Width: =80
                        X: =(Parent.Width - 80) / 2
                        Y: =40
                  - lblRequestsTitle:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =varColorText
                        Font: =varAppFont
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        Size: =16
                        Text: ="My Requests"
                        Width: =Parent.Width
                        Y: =icnRequests.Y + icnRequests.Height + 20
                  - lblRequestsDesc:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =varColorTextMuted
                        Font: =varAppFont
                        Height: =50
                        Text: |-
                          =If(
                              varNeedsConfirmCount > 0,
                              If(
                                  varNeedsConfirmCount = 1,
                                  "1 estimate waiting for your OK",
                                  varNeedsConfirmCount & " estimates waiting for your OK"
                              ),
                              If(
                                  varPickupReadyCount > 0,
                                  If(
                                      varPickupReadyCount = 1,
                                      "1 print ready for pickup",
                                      varPickupReadyCount & " prints ready for pickup"
                                  ),
                                  "View status, confirm estimates, or manage your existing requests"
                              )
                          )
                        Width: =Parent.Width - (varSpacingLG * 2)
                        X: =varSpacingLG
                        Y: =lblRequestsTitle.Y + lblRequestsTitle.Height + 8
                  - btnViewRequests:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        Color: =Color.White
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =varColorSuccess
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        FontWeight: =FontWeight.Bold
                        Height: =varButtonHeight
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(varColorSuccess, -15%)
                        OnSelect: =Navigate(scrMyRequests, varScreenTransition)
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =ColorFade(varColorSuccess, -25%)
                        RadiusBottomLeft: =varBtnBorderRadius
                        RadiusBottomRight: =varBtnBorderRadius
                        RadiusTopLeft: =varBtnBorderRadius
                        RadiusTopRight: =varBtnBorderRadius
                        Size: =14
                        Text: ="VIEW REQUESTS"
                        Width: =Parent.Width - (varSpacingLG * 2)
                        X: =varSpacingLG
                        Y: =Parent.Height - 70
      - lblHoursBanner:
          Control: Classic/Button
          Properties:
            BorderColor: =Color.Transparent
            BorderThickness: =0
            Color: |-
              =With(
                  {
                      wDay: Weekday(Now(), StartOfWeek.Monday),
                      wMin: Hour(Now()) * 60 + Minute(Now())
                  },
                  If(
                      wDay <= 5 && wMin >= 510 && wMin < 990,
                      varColorSuccess,
                      varColorWarning
                  )
              )
            DisplayMode: =DisplayMode.View
            Fill: =Color.Transparent
            Font: =varAppFont
            Height: =32
            Size: =12
            Text: |-
              =With(
                  {
                      wDay: Weekday(Now(), StartOfWeek.Monday),
                      wMin: Hour(Now()) * 60 + Minute(Now())
                  },
                  If(
                      wDay <= 5 && wMin >= 510 && wMin < 990,
                      "Open now  ·  " & varLabHours & "  ·  " & varPickupLocation,
                      "Closed now  ·  " & varLabHours & "  ·  " & varPickupLocation
                  )
              )
            Width: =Parent.Width
            Y: =Parent.Height - varNavHeight - 42
      - conNavBarHome:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =varNavHeight
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - varNavHeight
          Children:
            - recNavBgHome:
                Control: Rectangle
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =varColorHeader
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Height: =Parent.Height
                  Width: '=Parent.Width    '
            - btnNavHomeActive:
                Control: Classic/Button
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =varColorInfo
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =varButtonHeightSmall
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(varColorPrimary, -15%)
                  OnSelect: =// Already on this screen
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =varRadiusSmall
                  RadiusBottomRight: =varRadiusSmall
                  RadiusTopLeft: =varRadiusSmall
                  RadiusTopRight: =varRadiusSmall
                  Text: ="Home"
                  Width: =(Parent.Width - 80) / 3
                  X: =varSpacingXL
                  Y: =(Parent.Height - Self.Height) / 2
            - btnNavSubmitHome:
                Control: Classic/Button
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =varNavBtnInactiveFill
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =varButtonHeightSmall
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =varNavBtnHoverFill
                  OnSelect: =Navigate(scrSubmit, varScreenTransition)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =varRadiusSmall
                  RadiusBottomRight: =varRadiusSmall
                  RadiusTopLeft: =varRadiusSmall
                  RadiusTopRight: =varRadiusSmall
                  Text: ="New Request"
                  Width: =(Parent.Width - 80) / 3
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
            - btnNavMyRequestsHome:
                Control: Classic/Button
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =varNavBtnInactiveFill
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =varButtonHeightSmall
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =varNavBtnHoverFill
                  OnSelect: =Navigate(scrMyRequests, varScreenTransition)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =varRadiusSmall
                  RadiusBottomRight: =varRadiusSmall
                  RadiusTopLeft: =varRadiusSmall
                  RadiusTopRight: =varRadiusSmall
                  Text: ="My Requests"
                  Width: =(Parent.Width - 80) / 3
                  X: =Parent.Width - Self.Width - varSpacingXL
                  Y: =(Parent.Height - Self.Height) / 2
      - conLabToday:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            BorderColor: =varColorBorderLight
            BorderThickness: =1
            Fill: =varColorBgCard
            Height: =If(IsBlank(varLabStatus) || IsBlank(varLabStatus.StaffMessage), 148, 178)
            Width: =conSubmitCard.Width
            X: =conActionCards.X + conSubmitCard.X
            Y: =varHeaderHeight + 20
          Children:
            - lblLabTodayTitle:
                Control: Label
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =varColorText
                  Font: =varAppFont
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  Size: =14
                  Text: ="Lab Status:"
                  Width: =124
                  X: =16
                  Y: =12
            - btnBusyLevel:
                Control: Classic/Button
                Properties:
                  BorderThickness: =0
                  Color: |-
                    =If(
                        varLabStatus.BusyLevel.Value = "Typical",
                        RGBA(0, 0, 0, 1),
                        Color.White
                    )
                  DisplayMode: =DisplayMode.View
                  Fill: |-
                    =Switch(
                        varLabStatus.BusyLevel.Value,
                        "Quiet",
                        RGBA(16, 124, 16, 1),
                        "Typical",
                        RGBA(255, 185, 0, 1),
                        "Busy",
                        varColorWarning,
                        "Packed",
                        RGBA(209, 52, 56, 1),
                        varColorNeutral
                    )
                  Font: =varAppFont
                  Height: =28
                  HoverColor: =Self.Color
                  HoverFill: =Self.Fill
                  PressedFill: =Self.Fill
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =11
                  Text: =Coalesce(varLabStatus.BusyLevel.Value, "—")
                  Width: =Parent.Width - (lblLabTodayTitle.X + lblLabTodayTitle.Width + varSpacingSM) - 16
                  X: =lblLabTodayTitle.X + lblLabTodayTitle.Width + varSpacingSM
                  Y: =12
            - lblLabCounts:
                Control: Label
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =varColorText
                  Font: =varAppFont
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  Size: =14
                  Text: |-
                    =If(
                        Coalesce(varLabStatus.JobsWaiting, 0) = 1,
                        "1 waiting",
                        Coalesce(varLabStatus.JobsWaiting, 0) & " waiting"
                    ) & "  ·  " & If(
                        Coalesce(varLabStatus.JobsPrinting, 0) = 1,
                        "1 printing",
                        Coalesce(varLabStatus.JobsPrinting, 0) & " printing"
                    )
                  Width: =lblFilamentChip.X - Self.X - varSpacingSM
                  X: =16
                  Y: =61
            - lblLabWait:
                Control: Label
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =varColorTextMuted
                  Font: =varAppFont
                  Height: =29
                  Size: =10
                  Text: |-
                    =Coalesce(
                        varLabStatus.TypicalWaitText,
                        "Typical wait after you confirm: 1–3 lab days"
                    ) & If(
                        IsBlank(varLabStatus.UpdatedAt),
                        "",
                        "  ·  Updated " & Text(varLabStatus.UpdatedAt, DateTimeFormat.ShortTime)
                    )
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =114
            - lblLabStaffMessage:
                Control: Label
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =varColorWarning
                  Font: =varAppFont
                  Height: =24
                  Size: =11
                  Text: =varLabStatus.StaffMessage
                  Visible: =!IsBlank(varLabStatus.StaffMessage)
                  Width: =Parent.Width - 32
                  X: =16
                  Y: =144
            - lblFilamentChip:
                Control: Classic/Button
                Properties:
                  BorderColor: =varInputBorderColor
                  BorderThickness: =varInputBorderThickness * 2
                  Color: =varColorText
                  Fill: =Color.White
                  FocusedBorderColor: =varInputBorderColor
                  FocusedBorderThickness: =2
                  Font: =varAppFont
                  Height: =28
                  HoverBorderColor: =varInputBorderColor
                  HoverColor: =varColorText
                  HoverFill: =Color.White
                  PressedBorderColor: =varInputBorderColor
                  PressedColor: =varColorText
                  PressedFill: =Color.White
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Size: =11
                  TabIndex: =-1
                  Text: ="Filament " & Coalesce(varLabStatus.FilamentWaiting, 0)
                  Width: =120
                  X: =lblResinChip.X - Self.Width - varSpacingSM
                  Y: =61
            - lblResinChip:
                Control: Classic/Button
                Properties:
                  BorderColor: =varInputBorderColor
                  BorderThickness: =varInputBorderThickness * 2
                  Color: =varColorText
                  Fill: =Color.White
                  FocusedBorderColor: =varInputBorderColor
                  FocusedBorderThickness: =2
                  Font: =varAppFont
                  Height: =28
                  HoverBorderColor: =varInputBorderColor
                  HoverColor: =varColorText
                  HoverFill: =Color.White
                  PressedBorderColor: =varInputBorderColor
                  PressedColor: =varColorText
                  PressedFill: =Color.White
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Size: =11
                  TabIndex: =-1
                  Text: ="Resin " & Coalesce(varLabStatus.ResinWaiting, 0)
                  Width: =100
                  X: =Parent.Width - 16 - Self.Width
                  Y: =61
