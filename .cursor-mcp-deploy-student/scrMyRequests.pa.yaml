Screens:
  scrMyRequests:
    Properties:
      Fill: =varColorBg
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conHeader2:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =varHeaderHeight
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - recHeaderBg2:
                Control: Rectangle
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =varColorHeader
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Height: =Parent.Height
                  Width: =Parent.Width
            - lblHeaderTitle2:
                Control: Label
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =Color.White
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  FontWeight: =FontWeight.Semibold
                  Height: =30
                  Size: =18
                  Text: ="My Print Requests"
                  Width: =Parent.Width - 120
                  X: =20
                  Y: =11
            - btnRefresh:
                Control: Classic/Button
                Properties:
                  BorderColor: =Color.Transparent
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =varColorPrimary
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =22
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =varColorPrimaryHover
                  OnSelect: |-
                    =Refresh(PrintRequests);
                    Notify("Requests refreshed!", NotificationType.Information)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =varColorPrimaryPressed
                  RadiusBottomLeft: =varBtnBorderRadius
                  RadiusBottomRight: =varBtnBorderRadius
                  RadiusTopLeft: =varBtnBorderRadius
                  RadiusTopRight: =varBtnBorderRadius
                  Size: =8
                  Text: ="Refresh"
                  Width: =64
                  X: =Parent.Width - 84
                  Y: =15
      - conNavBar2:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =varNavHeight
            Width: =Parent.Width
            Y: =Parent.Height - varNavHeight
          Children:
            - recNavBg2:
                Control: Rectangle
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =varColorHeader
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Height: =Parent.Height
                  Width: =Parent.Width
            - btnNavHome2:
                Control: Classic/Button
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =varNavBtnInactiveFill
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =varButtonHeightSmall
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =varNavBtnHoverFill
                  OnSelect: =Navigate(scrHome, ScreenTransition.Fade)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =varRadiusSmall
                  RadiusBottomRight: =varRadiusSmall
                  RadiusTopLeft: =varRadiusSmall
                  RadiusTopRight: =varRadiusSmall
                  Text: ="Home"
                  Width: =(Parent.Width - 80) / 3
                  X: =varSpacingXL
                  Y: =(Parent.Height - Self.Height) / 2
            - btnNavSubmit2:
                Control: Classic/Button
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =varNavBtnInactiveFill
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =varButtonHeightSmall
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =varNavBtnHoverFill
                  OnSelect: =Navigate(scrSubmit, varScreenTransition)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =varRadiusSmall
                  RadiusBottomRight: =varRadiusSmall
                  RadiusTopLeft: =varRadiusSmall
                  RadiusTopRight: =varRadiusSmall
                  Text: ="New Request"
                  Width: =(Parent.Width - 80) / 3
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
            - btnNavMyRequests2:
                Control: Classic/Button
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =varColorInfo
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =varButtonHeightSmall
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(varColorPrimary, -15%)
                  OnSelect: =// Already on this screen
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =varRadiusSmall
                  RadiusBottomRight: =varRadiusSmall
                  RadiusTopLeft: =varRadiusSmall
                  RadiusTopRight: =varRadiusSmall
                  Text: ="My Requests"
                  Width: =(Parent.Width - 80) / 3
                  X: =Parent.Width - Self.Width - varSpacingXL
                  Y: =(Parent.Height - Self.Height) / 2
      - galMyRequestTabs:
          Control: Gallery
          Variant: Horizontal
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            FocusedBorderThickness: =0
            Height: =55
            Items: |-
              =Table(
                  {Status: "Open", Color: RGBA(70, 130, 220, 1)},
                  {Status: "Done", Color: RGBA(70, 130, 220, 1)},
                  {Status: "All", Color: RGBA(70, 130, 220, 1)}
              )
            TemplatePadding: =3
            TemplateSize: =148
            Transition: =Transition.Push
            Width: =Parent.Width
            Y: =varHeaderHeight
          Children:
            - btnMyRequestTab:
                Control: Classic/Button
                Properties:
                  BorderColor: =If(varMyRequestsFilter = ThisItem.Status, Color.Transparent, varInputBorderColor)
                  BorderThickness: =1
                  Color: =If(varMyRequestsFilter = ThisItem.Status, Color.White, varColorText)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =If(varMyRequestsFilter = ThisItem.Status, ThisItem.Color, RGBA(245, 245, 245, 1))
                  FocusedBorderColor: =Color.Transparent
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  HoverBorderColor: =If(varMyRequestsFilter = ThisItem.Status, Color.Transparent, ColorFade(Self.BorderColor, 20%))
                  HoverColor: =If(varMyRequestsFilter = ThisItem.Status, Color.White, varColorText)
                  HoverFill: =ColorFade(If(varMyRequestsFilter = ThisItem.Status, ThisItem.Color, RGBA(245, 245, 245, 1)), -10%)
                  OnSelect: =Set(varMyRequestsFilter, ThisItem.Status)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =If(varMyRequestsFilter = ThisItem.Status, Color.White, varColorText)
                  PressedFill: =ColorFade(If(varMyRequestsFilter = ThisItem.Status, ThisItem.Color, RGBA(245, 245, 245, 1)), -20%)
                  Size: =10
                  Text: |-
                    =With(
                        {
                            wMine: If(
                                !IsBlank(varMeEntraId),
                                Filter(
                                    PrintRequests,
                                    StudentEntraId = Text(varMeEntraId) || StudentEmail = varMeEmail || StudentEmail = varMeUPN
                                ),
                                Filter(
                                    PrintRequests,
                                    StudentEmail = varMeEmail || StudentEmail = varMeUPN
                                )
                            )
                        },
                        ThisItem.Status & " " & Text(
                            CountRows(
                                If(
                                    ThisItem.Status = "Open",
                                    Filter(
                                        wMine,
                                        Status.Value in ["Uploaded", "Pending", "Ready to Print", "Printing"]
                                    ),
                                    ThisItem.Status = "Done",
                                    Filter(
                                        wMine,
                                        Status.Value in ["Completed", "Paid & Picked Up", "Rejected", "Canceled", "Archived"]
                                    ),
                                    wMine
                                )
                            )
                        )
                    )
                  Width: =141
                  X: =5
                  Y: =4
      - conGalleryArea:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =Parent.Height - varHeaderHeight - 55 - varNavHeight - 36
            Width: =Parent.Width
            Y: =varHeaderHeight + 55
          Children:
            - galMyRequests:
                Control: Gallery
                Variant: Vertical
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Height: =Parent.Height - 16
                  Items: |-
                    =With(
                        {
                            wMine: If(
                                !IsBlank(varMeEntraId),
                                Filter(
                                    PrintRequests,
                                    StudentEntraId = Text(varMeEntraId) || StudentEmail = varMeEmail || StudentEmail = varMeUPN
                                ),
                                Filter(
                                    PrintRequests,
                                    StudentEmail = varMeEmail || StudentEmail = varMeUPN
                                )
                            )
                        },
                        SortByColumns(
                            If(
                                varMyRequestsFilter = "Open",
                                Filter(
                                    wMine,
                                    Status.Value in ["Uploaded", "Pending", "Ready to Print", "Printing"]
                                ),
                                varMyRequestsFilter = "Done",
                                Filter(
                                    wMine,
                                    Status.Value in ["Completed", "Paid & Picked Up", "Rejected", "Canceled", "Archived"]
                                ),
                                wMine
                            ),
                            "Created",
                            SortOrder.Descending
                        )
                    )
                  TemplatePadding: =8
                  TemplateSize: =varRequestCardHeight
                  Width: =Parent.Width
                  WrapCount: =3
                  Y: =8
                Children:
                  - recCardBg:
                      Control: Rectangle
                      Properties:
                        BorderColor: =varColorBorderLight
                        BorderThickness: =1.5
                        Fill: =varColorBgCard
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Height: =Parent.TemplateHeight
                        Width: =Parent.TemplateWidth
                  - lblReqKey:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =varColorText
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        OnSelect: =Select(Parent)
                        Size: =14
                        Text: |-
                          =If(!IsBlank(ThisItem.ReqKey), ThisItem.ReqKey, "Job #" & ThisItem.ID)
                        Width: =Parent.TemplateWidth - 240
                        X: =12
                        Y: =14
                  - btnStatusBadge:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        Color: =Color.White
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisplayMode: =DisplayMode.View
                        Fill: =RGBA(70, 130, 220, 1)
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        HoverBorderColor: =Color.Transparent
                        HoverColor: =Color.White
                        HoverFill: =RGBA(70, 130, 220, 1)
                        OnSelect: =Select(Parent)
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Size: =10
                        Text: =ThisItem.Status.Value
                        Width: =120
                        X: =Parent.TemplateWidth - 132
                        Y: =10
                  - lblSubmitDate:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =varColorTextMuted
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        Height: =22
                        OnSelect: =Select(Parent)
                        Size: =9
                        Text: |-
                          ="Submitted: " & Text(ThisItem.Created, varDateFormatShort)
                        Width: =Parent.TemplateWidth - 24
                        X: =13
                        Y: =45
                  - lblFilename:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =varColorTextMuted
                        Font: =varAppFont
                        Height: =20
                        OnSelect: =Select(Parent)
                        Size: =9
                        Text: |-
                          =With(
                              {
                                  wParts: Split(
                                      Trim(Coalesce(ThisItem.Student.DisplayName, varMeName)),
                                      " "
                                  )
                              },
                              Lower(First(wParts).Value & Last(wParts).Value) & "_" &
                              Lower(ThisItem.Method.Value) & "_" &
                              Substitute(Lower(ThisItem.Color.Value), " ", "")
                          )
                        Width: =Parent.TemplateWidth - 24
                        X: =13
                        Y: =72
                  - lblSubmittedTime:
                      Control: Label
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =varColorDanger
                        Font: =varAppFont
                        Height: =22
                        OnSelect: =Select(Parent)
                        Size: =8
                        Text: |-
                          =With(
                              {varMinutes: DateDiff(ThisItem.Created, Now(), TimeUnit.Minutes)},
                              If(
                                  varMinutes < 1,
                                  "Just now",
                                  If(
                                      varMinutes >= 1440,
                                      Text(RoundDown(varMinutes / 1440, 0)) & "d " &
                                      If(
                                          Mod(RoundDown(varMinutes / 60, 0), 24) > 0,
                                          Text(Mod(RoundDown(varMinutes / 60, 0), 24)) & "h",
                                          ""
                                      ),
                                      If(
                                          varMinutes >= 60,
                                          Text(RoundDown(varMinutes / 60, 0)) & "h ",
                                          ""
                                      ) &
                                      Text(Mod(varMinutes, 60)) & "m"
                                  )
                              )
                          )
                        Width: =90
                        X: =Parent.TemplateWidth - 230
                        Y: =16
                  - cirColorDotBackdrop:
                      Control: Circle
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =RGBA(149, 149, 149, 1)
                        Height: =16
                        OnSelect: =Select(Parent)
                        Visible: =ThisItem.Color.Value = "White" || ThisItem.Color.Value = "Matte White" || ThisItem.Color.Value = "Clear" || ThisItem.Color.Value = "Light Gray" || ThisItem.Color.Value = "Matte Light Gray" || ThisItem.Color.Value = "Silver" || ThisItem.Color.Value = "Any" || ThisItem.Color.Value = "Yellow" || ThisItem.Color.Value = "Matte Yellow" || ThisItem.Color.Value = "Gold"
                        Width: =16
                        X: =16
                        Y: =103
                  - cirColorDot:
                      Control: Circle
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: |-
                          =Switch(
                              ThisItem.Color.Value,
                              "Black", RGBA(26, 26, 26, 1),
                              "Matte Black", RGBA(26, 26, 26, 1),
                              "White", RGBA(255, 255, 255, 1),
                              "Matte White", RGBA(255, 255, 255, 1),
                              "Gray", RGBA(128, 128, 128, 1),
                              "Light Gray", RGBA(211, 211, 211, 1),
                              "Matte Light Gray", RGBA(211, 211, 211, 1),
                              "Red", RGBA(204, 0, 0, 1),
                              "Matte Red", RGBA(204, 0, 0, 1),
                              "Orange", RGBA(255, 102, 0, 1),
                              "Matte Orange", RGBA(255, 102, 0, 1),
                              "Yellow", RGBA(255, 215, 0, 1),
                              "Matte Yellow", RGBA(255, 215, 0, 1),
                              "Gold", RGBA(255, 215, 0, 1),
                              "Green", RGBA(76, 175, 80, 1),
                              "Matte Green", RGBA(76, 175, 80, 1),
                              "Forest Green", RGBA(34, 139, 34, 1),
                              "Blue", RGBA(0, 71, 171, 1),
                              "Matte Blue", RGBA(0, 71, 171, 1),
                              "Cobalt Blue", RGBA(0, 102, 204, 1),
                              "Purple", RGBA(107, 63, 160, 1),
                              "Matte Purple", RGBA(107, 63, 160, 1),
                              "Brown", RGBA(93, 64, 55, 1),
                              "Light Brown", RGBA(196, 164, 132, 1),
                              "Chocolate Brown", RGBA(123, 63, 0, 1),
                              "Matte Chocolate", RGBA(123, 63, 0, 1),
                              "Copper", RGBA(184, 115, 51, 1),
                              "Bronze", RGBA(205, 127, 50, 1),
                              "Silver", RGBA(192, 192, 192, 1),
                              "Clear", RGBA(245, 245, 245, 1),
                              "Any", RGBA(224, 224, 224, 1),
                              RGBA(153, 153, 153, 1)
                          )
                        Height: =12
                        OnSelect: =Select(Parent)
                        Width: =12
                        X: =18
                        Y: =105
                  - lblColorText:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =varColorTextMuted
                        Font: =varAppFont
                        Height: =20
                        OnSelect: =Select(Parent)
                        Size: =10
                        Text: =ThisItem.Color.Value
                        Width: =140
                        X: =36
                        Y: =101
                  - lblPrinter:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =varColorTextMuted
                        Font: =varAppFont
                        Height: =20
                        OnSelect: =Select(Parent)
                        Size: =8
                        Text: |-
                          ="🖨 " & Trim(If(Find("(", ThisItem.Printer.Value) > 0, Left(ThisItem.Printer.Value, Find("(", ThisItem.Printer.Value) - 1), ThisItem.Printer.Value))
                        Width: =Parent.TemplateWidth - 196
                        X: =180
                        Y: =101
                  - lblEstimates:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =varColorTextMuted
                        Font: =varAppFont
                        Height: =20
                        OnSelect: =Select(Parent)
                        Size: =10
                        Text: |-
                          =If(
                              ThisItem.Status.Value = "Paid & Picked Up" && !IsBlank(ThisItem.FinalCost),
                              "⚖ " & Text(ThisItem.FinalWeight) & "g" &
                              " · 💲" & Text(ThisItem.FinalCost, "[$-en-US]#,##0.00"),
                              If(
                                  !IsBlank(ThisItem.EstimatedWeight),
                                  "⚖ " & Text(ThisItem.EstimatedWeight) &
                                  If(ThisItem.Method.Value = "Resin", "mL", "g") &
                                  If(!IsBlank(ThisItem.EstimatedTime), " · ⏱ ~" & Text(ThisItem.EstimatedTime) & "h", "") &
                                  If(!IsBlank(ThisItem.EstimatedCost), " · 💲" & Text(ThisItem.EstimatedCost, "[$-en-US]#,##0.00"), ""),
                                  If(!IsBlank(ThisItem.EstimatedCost), "💲 " & Text(ThisItem.EstimatedCost, "[$-en-US]#,##0.00"), "")
                              )
                          )
                        Visible: =!IsBlank(ThisItem.EstimatedWeight) || !IsBlank(ThisItem.FinalWeight) || !IsBlank(ThisItem.EstimatedCost)
                        Width: =Parent.TemplateWidth - 24
                        X: =12
                        Y: =128
                  - btnConfirmEstimate:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        Color: =Color.White
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =varColorSuccess
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        Height: =varBtnHeight
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(varColorSuccess, -15%)
                        OnSelect: |-
                          =Set(varSelectedItem, ThisItem);
                          Set(varShowConfirmModal, ThisItem.ID)
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =ColorFade(varColorSuccess, -25%)
                        RadiusBottomLeft: =varBtnBorderRadius
                        RadiusBottomRight: =varBtnBorderRadius
                        RadiusTopLeft: =varBtnBorderRadius
                        RadiusTopRight: =varBtnBorderRadius
                        Size: =varBtnFontSize
                        Text: ="Confirm Estimate"
                        Visible: =ThisItem.Status.Value = "Pending" && !ThisItem.StudentConfirmed
                        Width: =Parent.TemplateWidth - 24
                        X: =12
                        Y: =165
                  - btnCancelRequest:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        Color: =Color.White
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =varColorDanger
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        Height: =varBtnHeight
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =Color.White
                        HoverFill: =ColorFade(varColorDanger, -15%)
                        OnSelect: |-
                          =Set(varSelectedItem, ThisItem);
                          Set(varShowCancelModal, ThisItem.ID)
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =ColorFade(varColorDanger, -25%)
                        RadiusBottomLeft: =varBtnBorderRadius
                        RadiusBottomRight: =varBtnBorderRadius
                        RadiusTopLeft: =varBtnBorderRadius
                        RadiusTopRight: =varBtnBorderRadius
                        Size: =varBtnFontSize
                        Text: ="Cancel Request"
                        Visible: =ThisItem.Status.Value in ["Uploaded", "Pending", "Ready to Print"]
                        Width: =150
                        X: =12
                        Y: =218
                  - lblStatusMessage:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =If(ThisItem.Status.Value = "Rejected", varColorDanger, RGBA(100, 100, 100, 1))
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        Height: =60
                        OnSelect: =Select(Parent)
                        Size: =11
                        Text: |-
                          =Switch(
                              ThisItem.Status.Value,
                              "Printing", "Your print is currently in progress.",
                              "Completed", "Ready for pickup at " & varPickupLocation & Char(10) & "Payment: " & varPaymentMethod,
                              "Paid & Picked Up", "Picked up on " & Text(ThisItem.PaymentDate, varDateFormatShort),
                              "Rejected",
                                  "Rejected" & If(
                                      !IsBlank(ThisItem.RejectionComment),
                                      ": " & ThisItem.RejectionComment,
                                      If(
                                          !IsBlank(Concat(ThisItem.RejectionReason, Value, "; ")),
                                          ": " & Concat(ThisItem.RejectionReason, Value, "; "),
                                          ". Check your email for details."
                                      )
                                  ),
                              "Canceled", "Request canceled by you",
                              ""
                          )
                        Visible: =ThisItem.Status.Value in ["Printing", "Completed", "Paid & Picked Up", "Rejected", "Canceled"]
                        Width: =Parent.TemplateWidth - 24
                        X: =12
                        Y: =155
                  - btnViewMessages:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =varColorPrimary
                        BorderThickness: =varInputBorderThickness
                        Color: =varColorPrimary
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =Color.White
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        Height: =varBtnHeight
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =Color.White
                        HoverFill: =varColorPrimary
                        OnSelect: |-
                          =Set(varSelectedItem, ThisItem);
                          Set(varShowViewMessagesModal, ThisItem.ID);
                          ClearCollect(colStudentRequestComments, Filter(RequestComments, RequestID = ThisItem.ID))
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =ColorFade(varColorPrimary, -15%)
                        RadiusBottomLeft: =varBtnBorderRadius
                        RadiusBottomRight: =varBtnBorderRadius
                        RadiusTopLeft: =varBtnBorderRadius
                        RadiusTopRight: =varBtnBorderRadius
                        Size: =10
                        Text: ="Messages"
                        Width: =110
                        X: =172
                        Y: =218
                  - btnViewFiles:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =varColorPrimary
                        BorderThickness: =varInputBorderThickness
                        Color: =varColorPrimary
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =Color.White
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        Height: =varBtnHeight
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =Color.White
                        HoverFill: =varColorPrimary
                        OnSelect: |-
                          =Set(varSelectedItem, ThisItem);
                          Set(varShowFilesModal, ThisItem.ID)
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =ColorFade(varColorPrimary, -15%)
                        RadiusBottomLeft: =varBtnBorderRadius
                        RadiusBottomRight: =varBtnBorderRadius
                        RadiusTopLeft: =varBtnBorderRadius
                        RadiusTopRight: =varBtnBorderRadius
                        Size: =10
                        Text: ="Files"
                        Width: =90
                        X: =292
                        Y: =218
      - lblEmptyState:
          Control: Label
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(100, 100, 100, 1)
            Font: =varAppFont
            Height: =200
            Size: =14
            Text: |-
              =If(
                  varMyRequestsFilter = "Open",
                  "No open print requests. Try Done or All.",
