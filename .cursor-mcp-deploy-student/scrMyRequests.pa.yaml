Screens:
  scrMyRequests:
    Properties:
      Fill: =varColorBg
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conHeader2:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =varHeaderHeight
            Width: =Parent.Width
          Children:
            - recHeaderBg2:
                Control: Rectangle
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =varColorHeader
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Height: =Parent.Height
                  Width: =Parent.Width
            - lblHeaderTitle2:
                Control: Label
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =Color.White
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  FontWeight: =FontWeight.Semibold
                  Height: =30
                  Size: =18
                  Text: ="My Print Requests"
                  Width: =Parent.Width - 120
                  X: =20
                  Y: =11
            - btnRefresh:
                Control: Classic/Button
                Properties:
                  BorderColor: =Color.Transparent
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =varColorPrimary
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =22
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =varColorPrimaryHover
                  OnSelect: |-
                    =Refresh(PrintRequests);
                    Notify("Requests refreshed!", NotificationType.Information)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =varColorPrimaryPressed
                  RadiusBottomLeft: =varBtnBorderRadius
                  RadiusBottomRight: =varBtnBorderRadius
                  RadiusTopLeft: =varBtnBorderRadius
                  RadiusTopRight: =varBtnBorderRadius
                  Size: =8
                  Text: ="Refresh"
                  Width: =64
                  X: =Parent.Width - 84
                  Y: =15
      - conNavBar2:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =varNavHeight
            Width: =Parent.Width
            Y: =Parent.Height - varNavHeight
          Children:
            - recNavBg2:
                Control: Rectangle
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =varColorHeader
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Height: =Parent.Height
                  Width: =Parent.Width
            - btnNavHome2:
                Control: Classic/Button
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =varNavBtnInactiveFill
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =varButtonHeightSmall
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =varNavBtnHoverFill
                  OnSelect: =Navigate(scrHome, ScreenTransition.Fade)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =varRadiusSmall
                  RadiusBottomRight: =varRadiusSmall
                  RadiusTopLeft: =varRadiusSmall
                  RadiusTopRight: =varRadiusSmall
                  Text: ="Home"
                  Width: =(Parent.Width - 80) / 3
                  X: =varSpacingXL
                  Y: =(Parent.Height - Self.Height) / 2
            - btnNavSubmit2:
                Control: Classic/Button
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =varNavBtnInactiveFill
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =varButtonHeightSmall
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =varNavBtnHoverFill
                  OnSelect: =Navigate(scrSubmit, varScreenTransition)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =varRadiusSmall
                  RadiusBottomRight: =varRadiusSmall
                  RadiusTopLeft: =varRadiusSmall
                  RadiusTopRight: =varRadiusSmall
                  Text: ="New Request"
                  Width: =(Parent.Width - 80) / 3
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
            - btnNavMyRequests2:
                Control: Classic/Button
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =varColorInfo
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =varButtonHeightSmall
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(varColorPrimary, -15%)
                  OnSelect: =// Already on this screen
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =varRadiusSmall
                  RadiusBottomRight: =varRadiusSmall
                  RadiusTopLeft: =varRadiusSmall
                  RadiusTopRight: =varRadiusSmall
                  Text: ="My Requests"
                  Width: =(Parent.Width - 80) / 3
                  X: =Parent.Width - Self.Width - varSpacingXL
                  Y: =(Parent.Height - Self.Height) / 2
      - conGalleryArea:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =Parent.Height - varHeaderHeight - varNavHeight
            Width: =Parent.Width
            Y: =varHeaderHeight
          Children:
            - galMyRequests:
                Control: Gallery
                Variant: Vertical
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Height: =Parent.Height - 170
                  Items: |-
                    =If(
                        !IsBlank(varMeEntraId),
                        SortByColumns(
                            Filter(
                                PrintRequests,
                                StudentEntraId = Text(varMeEntraId) || StudentEmail = varMeEmail || StudentEmail = varMeUPN
                            ),
                            "Created",
                            SortOrder.Descending
                        ),
                        SortByColumns(
                            Filter(
                                PrintRequests,
                                StudentEmail = varMeEmail || StudentEmail = varMeUPN
                            ),
                            "Created",
                            SortOrder.Descending
                        )
                    )
                  TemplatePadding: =8
                  TemplateSize: =varRequestCardHeight
                  Width: =Parent.Width
                  WrapCount: =3
                  Y: =90
                Children:
                  - recCardBg:
                      Control: Rectangle
                      Properties:
                        BorderColor: =RGBA(128, 128, 128, 1)
                        BorderThickness: =1
                        Fill: =varColorBgCard
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Height: =Parent.TemplateHeight - varSpacingSM
                        Width: =Parent.TemplateWidth - 32
                        X: =varSpacingLG
                  - lblReqKey:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(50, 50, 50, 1)
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        OnSelect: =Select(Parent)
                        Text: |-
                          =If(!IsBlank(ThisItem.ReqKey), ThisItem.ReqKey, "Job #" & ThisItem.ID)
                        X: =28
                        Y: =12
                  - btnStatusBadge:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        BorderThickness: =0
                        Color: =If(ThisItem.Status.Value = "Pending", Color.Black, Color.White)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisplayMode: =DisplayMode.View
                        Fill: =LookUp(varStatusColors, Status = ThisItem.Status.Value, Color)
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =varColorPrimaryHover
                        OnSelect: =Select(Parent)
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Size: =12
                        Text: =ThisItem.Status.Value
                        Width: =120
                        X: =Parent.TemplateWidth - 150
                        Y: =10
                  - lblSubmitDate:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(100, 100, 100, 1)
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        Height: =20
                        OnSelect: =Select(Parent)
                        Size: =11
                        Text: |-
                          ="Submitted: " & Text(ThisItem.Created, varDateFormatShort)
                        Width: =200
                        X: =28
                        Y: =40
                  - lblPrintDetails:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(80, 80, 80, 1)
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        Height: =20
                        OnSelect: =Select(Parent)
                        Size: =11
                        Text: |-
                          =ThisItem.Method.Value & " • " & 
                          Trim(If(Find("(", ThisItem.Printer.Value) > 0, Left(ThisItem.Printer.Value, Find("(", ThisItem.Printer.Value) - 1), ThisItem.Printer.Value)) & 
                          " • " & ThisItem.Color.Value
                        Width: =Parent.TemplateWidth - 60
                        X: =28
                        Y: =62
                  - lblEstimate:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =varColorPrimary
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        OnSelect: =Select(Parent)
                        Text: |-
                          ="Estimated Cost: " & Text(ThisItem.EstimatedCost, "[$-en-US]$#,##0.00")
                        Visible: =!IsBlank(ThisItem.EstimatedCost)
                        Width: =Parent.TemplateWidth - 60
                        X: =28
                        Y: =85
                  - btnConfirmEstimate:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        Color: =Color.White
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =varColorSuccess
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        FontWeight: =FontWeight.Bold
                        Height: =45
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(varColorSuccess, -15%)
                        OnSelect: |-
                          =Set(varSelectedItem, ThisItem);
                          Set(varShowConfirmModal, ThisItem.ID)
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =ColorFade(varColorSuccess, -25%)
                        RadiusBottomLeft: =varBtnBorderRadius
                        RadiusBottomRight: =varBtnBorderRadius
                        RadiusTopLeft: =varBtnBorderRadius
                        RadiusTopRight: =varBtnBorderRadius
                        Size: =13
                        Text: ="✓ CONFIRM ESTIMATE"
                        Visible: =ThisItem.Status.Value = "Pending" && !ThisItem.StudentConfirmed
                        Width: =Parent.TemplateWidth - 60
                        X: =28
                        Y: =115
                  - btnCancelRequest:
                      Control: Classic/Button
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        Color: =varColorDanger
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =ColorFade(varColorDanger, varSecondaryFade)
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(varColorDanger, 55%)
                        OnSelect: |-
                          =Set(varSelectedItem, ThisItem);
                          Set(varShowCancelModal, ThisItem.ID)
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =ColorFade(varColorDanger, 45%)
                        RadiusBottomLeft: =varBtnBorderRadius
                        RadiusBottomRight: =varBtnBorderRadius
                        RadiusTopLeft: =varBtnBorderRadius
                        RadiusTopRight: =varBtnBorderRadius
                        Size: =varBtnFontSize
                        Text: ="Cancel Request"
                        Visible: =ThisItem.Status.Value in ["Uploaded", "Pending", "Ready to Print"]
                        Width: =150
                        X: =28
                        Y: =165
                  - lblStatusMessage:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =If(ThisItem.Status.Value = "Rejected", varColorDanger, RGBA(100, 100, 100, 1))
                        FocusedBorderThickness: =varFocusedBorderThickness
                        Font: =varAppFont
                        Height: =60
                        OnSelect: =Select(Parent)
                        Size: =11
                        Text: |-
                          =Switch(
                              ThisItem.Status.Value,
                              "Printing", "Your print is currently in progress.",
                              "Completed", "Ready for pickup at " & varPickupLocation & Char(10) & "Payment: " & varPaymentMethod,
                              "Paid & Picked Up", "Picked up on " & Text(ThisItem.PaymentDate, varDateFormatShort),
                              "Rejected",
                                  "Rejected" & If(
                                      !IsBlank(ThisItem.RejectionComment),
                                      ": " & ThisItem.RejectionComment,
                                      If(
                                          !IsBlank(Concat(ThisItem.RejectionReason, Value, "; ")),
                                          ": " & Concat(ThisItem.RejectionReason, Value, "; "),
                                          ". Check your email for details."
                                      )
                                  ),
                              "Canceled", "Request canceled by you",
                              ""
                          )
                        Visible: =ThisItem.Status.Value in ["Printing", "Completed", "Paid & Picked Up", "Rejected", "Canceled"]
                        Width: =Parent.TemplateWidth - 60
                        X: =28
                        Y: =115
      - lblEmptyState:
          Control: Label
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(100, 100, 100, 1)
            Font: =varAppFont
            Height: =200
            Size: =14
            Text: ="You haven't submitted any print requests yet. Tap 'Submit' to create your first request!"
            Visible: =galMyRequests.AllItemsCount = 0
            Width: =Parent.Width - 40
            X: =20
            Y: =Parent.Height / 2 - 100
      - conConfirmModal:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Visible: =varShowConfirmModal > 0
            Width: =Parent.Width
          Children:
            - recConfirmOverlay:
                Control: Rectangle
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 0, 0, 0.7)
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Height: =Parent.Height
                  Width: =Parent.Width
            - recConfirmModal:
                Control: Rectangle
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =Color.White
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Height: =450
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =(Parent.Height - 450) / 2
            - lblConfirmTitle:
                Control: Label
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =varColorSuccess
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  FontWeight: =FontWeight.Bold
                  Height: =35
                  Size: =18
                  Text: ="Confirm Your Print Estimate"
                  Width: =recConfirmModal.Width - 40
                  X: =recConfirmModal.X + 20
                  Y: =recConfirmModal.Y + 20
            - lblConfirmReqKey:
                Control: Label
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(100, 100, 100, 1)
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =25
                  Size: =14
                  Text: =varSelectedItem.ReqKey
                  Width: =recConfirmModal.Width - 40
                  X: =recConfirmModal.X + 20
                  Y: =recConfirmModal.Y + 60
            - lblConfirmCost:
                Control: Label
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =varColorPrimary
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  FontWeight: =FontWeight.Bold
                  Height: =50
                  Size: =28
                  Text: |-
                    =If(
                        IsBlank(varSelectedItem.EstimatedCost),
                        "Cost: TBD",
                        Text(varSelectedItem.EstimatedCost, "[$-en-US]$#,##0.00")
                    )
                  Width: =recConfirmModal.Width - 40
                  X: =recConfirmModal.X + 20
                  Y: =recConfirmModal.Y + 100
            - lblConfirmDetails:
                Control: Label
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(80, 80, 80, 1)
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =80
                  Size: =12
                  Text: |-
                    ="Method: " & varSelectedItem.Method.Value & "  •  Color: " & varSelectedItem.Color.Value &
                    Char(10) &
                    If(!IsBlank(varSelectedItem.EstimatedTime), "Print Time: ~" & Text(varSelectedItem.EstimatedTime) & " hours", "") &
                    Char(10) &
                    If(!IsBlank(varSelectedItem.EstimatedWeight), "Material: ~" & Text(varSelectedItem.EstimatedWeight) & "g", "")
                  Width: =recConfirmModal.Width - 40
                  X: =recConfirmModal.X + 20
                  Y: =recConfirmModal.Y + 160
            - lblConfirmWarning:
                Control: Label
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(150, 150, 150, 1)
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =50
                  Size: =11
                  Text: ="By confirming, you agree to pay this amount at pickup. Printing will begin after confirmation."
                  Width: =recConfirmModal.Width - 40
                  X: =recConfirmModal.X + 20
                  Y: =recConfirmModal.Y + 250
            - btnConfirmCancel:
                Control: Classic/Button
                Properties:
                  BorderColor: =Color.Transparent
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =varColorNeutral
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =varBtnHeight
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(varColorNeutral, -15%)
                  OnSelect: |-
                    =Set(varShowConfirmModal, 0);
                    Set(varSelectedItem, Blank())
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =ColorFade(varColorNeutral, -25%)
                  RadiusBottomLeft: =varBtnBorderRadius
                  RadiusBottomRight: =varBtnBorderRadius
                  RadiusTopLeft: =varBtnBorderRadius
                  RadiusTopRight: =varBtnBorderRadius
                  Size: =varBtnFontSize
                  Text: ="Cancel"
                  Width: =recConfirmModal.Width - 40
                  X: =recConfirmModal.X + 20
                  Y: =recConfirmModal.Y + 320 + varBtnHeightLarge + varSpacingMD
            - btnConfirmYes:
                Control: Classic/Button
                Properties:
                  BorderColor: =Color.Transparent
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =varColorSuccess
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  FontWeight: =FontWeight.Bold
                  Height: =varBtnHeightLarge
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(varColorSuccess, -15%)
                  OnSelect: |-
                    =Set(varIsLoading, true);
                    IfError(
                        Patch(
                            PrintRequests,
                            LookUp(PrintRequests, ID = varShowConfirmModal),
                            {StudentConfirmed: true}
                        );
                        Set(varIsLoading, false);
                        Set(varShowConfirmModal, 0);
                        Set(varSelectedItem, Blank());
                        Set(varNeedsConfirmCount, Max(0, Coalesce(varNeedsConfirmCount, 0) - 1));
                        Notify("Estimate confirmed! Your print is now in the queue.", NotificationType.Success);
                        Refresh(PrintRequests),
                        Notify(
                            "Could not confirm the estimate. Please try again.",
                            NotificationType.Error,
                            5000
                        );
                        Set(varIsLoading, false)
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =ColorFade(varColorSuccess, -25%)
                  RadiusBottomLeft: =varBtnBorderRadius
                  RadiusBottomRight: =varBtnBorderRadius
                  RadiusTopLeft: =varBtnBorderRadius
                  RadiusTopRight: =varBtnBorderRadius
                  Size: =14
                  Text: ="I CONFIRM THIS ESTIMATE"
                  Width: =recConfirmModal.Width - 40
                  X: =recConfirmModal.X + varSpacingXL
                  Y: =recConfirmModal.Y + 320
      - conCancelModal:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Visible: =varShowCancelModal > 0
            Width: =Parent.Width
          Children:
            - recCancelOverlay:
                Control: Rectangle
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 0, 0, 0.7)
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Height: =Parent.Height
                  Width: =Parent.Width
            - recCancelModal:
                Control: Rectangle
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =Color.White
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Height: =360
                  Width: =Parent.Width - 60
                  X: =30
                  Y: =(Parent.Height - 360) / 2
            - lblCancelTitle:
                Control: Label
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =varColorDanger
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  FontWeight: =FontWeight.Bold
                  Height: =30
                  Size: =18
                  Text: ="Cancel Request?"
                  Width: =recCancelModal.Width - 40
                  X: =recCancelModal.X + 20
                  Y: =recCancelModal.Y + 20
            - lblCancelMessage:
                Control: Label
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(80, 80, 80, 1)
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =120
                  Size: =12
                  Text: |-
                    ="Are you sure you want to cancel request " & Coalesce(varSelectedItem.ReqKey, "this print") & "?" & Char(10) & Char(10) &
                    If(
                        varSelectedItem.Status.Value = "Ready to Print",
                        "Staff may already be preparing this print. If you are not sure, email " & varSupportEmail & " or visit " & varPickupLocation & " before canceling." & Char(10) & Char(10) &
                        "This cannot be undone. You would need to submit a new request.",
                        "This action cannot be undone. You'll need to submit a new request if you change your mind."
                    )
                  Width: =recCancelModal.Width - 40
                  X: =recCancelModal.X + 20
                  Y: =recCancelModal.Y + 60
            - btnCancelYes:
                Control: Classic/Button
                Properties:
                  BorderColor: =Color.Transparent
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =varColorDanger
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =varBtnHeight
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(varColorDanger, -15%)
                  OnSelect: |-
                    =Set(varIsLoading, true);
                    IfError(
                        With(
                            {wRow: LookUp(PrintRequests, ID = varShowCancelModal)},
                            Patch(
                                PrintRequests,
                                wRow,
                                {
                                    Status: {Value: "Canceled"},
                                    LastAction: {Value: "Canceled by Student"},
                                    LastActionAt: Now(),
                                    StaffNotes: If(
                                        IsBlank(wRow.StaffNotes),
                                        "Canceled by student " & Text(Now(), varDateFormatShort),
                                        Concatenate(
                                            wRow.StaffNotes,
                                            " | ",
                                            "Canceled by student " & Text(Now(), varDateFormatShort)
                                        )
                                    )
                                }
                            )
                        );
                        Set(varIsLoading, false);
                        Set(varShowCancelModal, 0);
                        Set(varSelectedItem, Blank());
                        Notify("Request canceled successfully.", NotificationType.Information);
                        Refresh(PrintRequests),
                        Notify(
                            "Could not cancel the request. Please try again.",
                            NotificationType.Error,
                            5000
                        );
                        Set(varIsLoading, false)
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =ColorFade(varColorDanger, -25%)
                  RadiusBottomLeft: =varBtnBorderRadius
                  RadiusBottomRight: =varBtnBorderRadius
                  RadiusTopLeft: =varBtnBorderRadius
                  RadiusTopRight: =varBtnBorderRadius
                  Size: =13
                  Text: ="Yes, Cancel Request"
                  Width: =recCancelModal.Width - 40
                  X: =recCancelModal.X + varSpacingXL
                  Y: =recCancelModal.Y + 200
            - btnCancelNo:
                Control: Classic/Button
                Properties:
                  BorderColor: =Color.Transparent
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =RGBA(240, 240, 240, 1)
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =varBtnHeight
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(varColorNeutral, -15%)
                  OnSelect: |-
                    =Set(varShowCancelModal, 0);
                    Set(varSelectedItem, Blank())
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =ColorFade(varColorNeutral, -25%)
                  RadiusBottomLeft: =varBtnBorderRadius
                  RadiusBottomRight: =varBtnBorderRadius
                  RadiusTopLeft: =varBtnBorderRadius
                  RadiusTopRight: =varBtnBorderRadius
                  Size: =varBtnFontSize
                  Text: ="No, Keep Request"
                  Width: =recCancelModal.Width - 40
                  X: =recCancelModal.X + 20
                  Y: =recCancelModal.Y + 200 + varBtnHeight + varSpacingXL
      - conLoadingOverlayMyRequests:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =Parent.Height
            Visible: =varIsLoading
            Width: =Parent.Width
          Children:
            - recLoadingOverlayMyRequests:
                Control: Rectangle
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =varColorOverlay
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Height: =Parent.Height
                  Width: =Parent.Width
            - recLoadingBgMyRequests:
                Control: Rectangle
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =varColorBgCard
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Width: =200
                  X: =(Parent.Width - 200) / 2
                  Y: =(Parent.Height - 100) / 2
            - lblLoadingTextMyRequests:
                Control: Label
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =varColorPrimary
                  FocusedBorderThickness: =varFocusedBorderThickness
                  Font: =varAppFont
                  Height: =30
                  Size: =14
                  Text: ="Saving..."
                  Width: =recLoadingBgMyRequests.Width
                  X: =recLoadingBgMyRequests.X
                  Y: =recLoadingBgMyRequests.Y + 35
